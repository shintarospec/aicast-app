[server]
# セッション管理の改善
maxUploadSize = 100
maxMessageSize = 200
enableCORS = true
enableXsrfProtection = true

# 静的ファイル設定
enableStaticServing = false

[browser]
# ブラウザ関連設定
gatherUsageStats = false

[logger]
# ログ設定
level = "info"

[theme]
# AIcast Room サイバーパンクテーマ
primaryColor = "#00FFFF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#2F4F4F"
textColor = "#FFFFFF"
font = "sans serif"