# 認証設定
[auth]
# パスワード: "aicast-team-2025" のハッシュ
password_hash = "800a75eb7f5071eecff69291c0b2db200e433945e788471dd5e4b1c5eda0c4f1"

# Google Cloud設定
[gcp]
project_id = "aicast-472807"
location = "asia-northeast1"

# Google OAuth設定（Vertex AI認証用）
[google_oauth]
client_id = "YOUR_GOOGLE_OAUTH_CLIENT_ID"
project_id = "YOUR_GCP_PROJECT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_secret = "YOUR_GOOGLE_OAUTH_CLIENT_SECRET"
redirect_uris = ["http://localhost"]

# セキュリティ設定
[security]
production_mode = true
use_secret_manager = true

# データベース設定
[database]
auto_initialize = true
backup_enabled = true

# 🔧 OAuth認証設定手順:
# 1. Google Cloud Console → API & Services → Credentials
# 2. 既存のOAuth 2.0クライアントIDを確認
# 3. client_id と client_secret をコピーして上記の YOUR_* 部分を置換
# 4. Streamlit Cloud の Settings > Secrets でこの内容をペースト

# 🔧 使用方法:
# 1. Streamlit Cloud の Settings > Secrets でこの内容をコピー&ペースト
# 2. password_hash を変更する場合は auth_system.py でハッシュ生成
# 3. project_id は実際のGoogle Cloud Project IDに変更